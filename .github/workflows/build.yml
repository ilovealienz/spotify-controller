# Builds the newest Minecraft version listed in settings.gradle.kts and uploads the jar.
# Pushing a tag starting with v (e.g. v4.5.1-fork.1) also publishes a GitHub release with the jar.

name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      # 26.x needs Java 25 for compiling; Gradle itself runs on 21 (listed last, so it is the default)
      - name: setup jdk 25 and 21
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
      - name: find latest version
        run: |
          LATEST=$(sed -n '/val versions = listOf(/,/)/p' settings.gradle.kts | grep -o '"[^"]*-fabric"' | tail -1 | tr -d '"')
          echo "Building $LATEST"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew :$LATEST:build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotify-controller-${{ env.LATEST }}
          path: |
            versions/${{ env.LATEST }}/build/libs/*.jar
            !versions/${{ env.LATEST }}/build/libs/*-sources.jar
      - name: remove sources jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: rm -f versions/$LATEST/build/libs/*-sources.jar
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (${{ env.LATEST }})
          files: versions/${{ env.LATEST }}/build/libs/*.jar
          generate_release_notes: true
